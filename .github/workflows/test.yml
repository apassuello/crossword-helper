name: Tests & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov pytest-xdist pytest-mock

    - name: Run unit tests
      run: |
        COV_ARGS=""
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
          COV_ARGS="--cov=backend --cov=cli --cov-report=xml --cov-report=term"
        fi
        pytest backend/tests/unit cli/tests/unit -v $COV_ARGS -n auto

    # Everything under pytest.ini's testpaths except the unit dirs the step
    # above already ran -- an exclusion list, deliberately, not an enumeration.
    # Enumerating subdirectories silently orphans any test file added outside
    # the list: backend/tests/test_api.py and backend/tests/test_openapi_contract.py
    # sit directly under backend/tests/, so `pytest` picks them up locally via
    # testpaths while CI never ran them. Excluding what is already covered
    # cannot orphan a new file; enumerating what to include can, and did.
    # Proof this step covers them: `pytest --collect-only -q` from the repo root
    # and this step's argv must report the same set outside the unit dirs.
    - name: Run integration and remaining tests
      run: |
        COV_ARGS=""
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
          COV_ARGS="--cov=backend --cov=cli --cov-append --cov-report=xml --cov-report=term"
        fi
        pytest backend/tests cli/tests tests \
          --ignore=backend/tests/unit \
          --ignore=cli/tests/unit \
          -v $COV_ARGS

    - name: Verify coverage file exists
      if: matrix.python-version == '3.12'
      run: |
        ls -lh coverage.xml
        echo "Coverage file size: $(wc -c < coverage.xml) bytes"
        head -20 coverage.xml

    - name: Upload coverage to Codecov
      # Only upload from Python 3.12 to avoid duplicate uploads
      if: matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.xml
        flags: unittests
        name: codecov-upload
        fail_ci_if_error: true
        verbose: true

    - name: Generate coverage HTML report
      if: matrix.python-version == '3.12'
      run: |
        coverage html

    - name: Upload coverage HTML
      if: matrix.python-version == '3.12'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: htmlcov/

  lint:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install linting tools
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy

    - name: Run flake8
      run: |
        flake8 backend/ cli/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 backend/ cli/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Check code formatting with black
      run: |
        black --check backend/ cli/ || true

    - name: Check import sorting with isort
      run: |
        isort --check-only backend/ cli/ || true

  guards:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # The pre-commit hook only ever sees STAGED files, so an endpoint-confinement
    # violation in a file nobody touched passes vacuously (CONTRIBUTING.md §2).
    # --full-tree scans every tracked file under src/ instead, which is the only
    # fix for that blind spot as a class. Guard 1 (scrub patterns) is a diff
    # property and has no full-tree equivalent, so this covers Guard 2 only.
    - name: Check API-URL confinement across the whole tree
      run: ./scripts/check-guards.sh --full-tree

  docs:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Guards the two failure modes that rotted this repo's docs: dead relative
    # links, and derivable state (counts, pass rates, "FIXED") asserted in prose.
    # Archives and docs/dev/FABRICATION-LOG.md are excluded by the script.
    - name: Check documentation
      run: ./scripts/docs-check.sh

    # docs/user-guide/site/ is built from the Markdown guide and committed, so a
    # reader can open it from a clone. Fails if the two have drifted apart.
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Check the HTML user guide matches the Markdown
      run: |
        python -m pip install "$(grep -i '^markdown' requirements.txt)"
        python scripts/build_user_guide.py --check

  slow-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Cache pip dependencies
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-mock

    # The unit/integration steps in the `test` job pass explicit path args,
    # which override pytest.ini's `addopts = -v -m "not slow"` -- but that
    # still deselects `slow`-marked tests, so no job ever ran the real
    # backend<->CLI subprocess e2e for pause/resume. That is how pause/resume
    # shipped broken with a fully green suite (.claude/CLAUDE.md, "Seam
    # tests"). `-m slow` overrides the deselection explicitly.
    #
    # One version only (3.12, the version this repo already privileges for
    # coverage/lint): these tests exercise subprocess argv + file IPC wiring,
    # which is Python-version-independent, so running the multi-minute gate
    # four times across the `test` matrix would buy nothing but CI minutes.
    # Own job rather than a step in `test`, matching the single-concern
    # `guards`/`docs` jobs above -- a step here would still pay the 4x matrix
    # cost. Serial (no -n auto): the pause/resume tests share /tmp state/flag
    # dirs via file IPC and are not safe to parallelize against each other.
    #
    # No path arguments, for the same reason the `test` job stopped enumerating
    # subdirectories: this step named four pause/resume files, so a slow test
    # anywhere else ran nowhere -- not here, and not in `test`, which deselects
    # `slow`. The domain propagator's real-word-list oracle test was written
    # against that gap. `-m slow` with no paths cannot orphan a marked test.
    #
    # Cost of the widening, measured before it landed:
    # `pytest -m slow` over the tree, rc=0, under nine minutes wall-clock. That
    # is the command to re-run if this job's runtime ever needs re-justifying.
    - name: Run the slow suite (real subprocess, real word list)
      run: pytest -m slow -v

  # Performance job removed - benchmarks are manual scripts, not automated tests
  # Run manually when needed: python cli/tests/performance/benchmark_algorithms.py
  # See cli/tests/performance/README.md for details
