# Plain `pre-commit install` wires ALL THREE stages. Without this key it
# installs only .git/hooks/pre-commit, so the pre-push suites below would be
# declared and never run -- which was the state until 2026-09-20. commit-msg
# joined the list when the partial-closure check landed the same day; a stage
# added here without being added there is a hook installed for nobody.
default_install_hook_types: [pre-commit, pre-push, commit-msg]

repos:
  - repo: https://github.com/psf/black
    rev: 25.1.0
    hooks:
      - id: black
        args: [--line-length=127]
        types: [python]

  - repo: https://github.com/pycqa/isort
    rev: 6.0.1
    hooks:
      - id: isort
        args: [--profile=black, --line-length=127]
        types: [python]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.6
    hooks:
      - id: ruff
        args: [--fix]
        types: [python]

  - repo: https://github.com/pycqa/flake8
    rev: 7.2.0
    hooks:
      - id: flake8
        args:
          - "--max-line-length=127"
          - "--select=E9,F63,F7,F82"
          - "--extend-ignore=E203"
        types: [python]

  - repo: local
    hooks:
      - id: check-guards
        name: scrub + api-url confinement guard
        entry: scripts/check-guards.sh
        language: system
        pass_filenames: false
        always_run: true

      # --- commit-msg stage -----------------------------------------------
      # D12: a trailer naming one item of a multi-item issue still closes the
      # whole issue, because the closing keyword binds to the issue number and
      # ignores what follows. #21 auto-closed with two items unimplemented on
      # the rebase-merge of PR #27, after the register had warned about it.
      #
      # scripts/check-commit-msg.sh is the PRIMARY record: it carries the
      # genesis, the measured true/false counts that chose this pattern over
      # the broader one, and the escape hatch. Amend it, not this comment.
      #
      # A third hook type. It is wired by a plain `pre-commit install` only
      # because default_install_hook_types at the top of this file lists it;
      # a stage added here and not there is a hook installed for nobody, which
      # Guard 4 in scripts/check-guards.sh now reports.
      - id: check-commit-msg
        name: reject partial-closure trailers (commit-msg)
        entry: scripts/check-commit-msg.sh
        language: system
        stages: [commit-msg]

      # --- pre-push stage -------------------------------------------------
      # These replace an untracked .git/hooks/pre-push whose three defects
      # survived precisely because nothing could see the file: an explicit
      # pytest path list that orphaned whole directories of tests, a file-type
      # that let config-only pushes run nothing, and 2>/dev/null on vitest
      # that discarded ~2320 of its 2558 output lines.
      #
      # Both gates are EXCLUSIONS, so a file type nobody anticipated runs
      # both suites rather than neither. The shared extension set mirrors
      # scripts/docs-check.sh:66 -- change one, change the other.
      #
      # No path arguments to pytest: pytest.ini's testpaths and -m "not slow"
      # describe the intent. -q is deliberate (addopts carries -v; -v -q net
      # to normal, and without -q collection alone prints 5032 lines). No -x:
      # across the full suite a first failure would mask everything after it.
      - id: pytest-push
        name: full pytest suite (pre-push)
        entry: pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
        exclude: '\.(md|pdf|png|jpg|jpeg|gif|ico|pkl|lock|woff|woff2|ttf|js|jsx|ts|tsx|css|scss)$'

      - id: vitest-push
        name: frontend vitest suite (pre-push)
        entry: npx vitest run --reporter=verbose
        language: system
        pass_filenames: false
        stages: [pre-push]
        exclude: '\.(md|pdf|png|jpg|jpeg|gif|ico|pkl|lock|woff|woff2|ttf|py)$'
